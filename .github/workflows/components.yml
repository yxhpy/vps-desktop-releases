# Regenerates the desktop app's signed component manifest (design point 9 in the app's docs/desktop-app.md).
# Only the schedule and a manual run by someone with write access start it; no outside event can.
name: components

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: components
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks every upstream file and writes the unsigned payload; any failure stops the run here.
      - name: List the components
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 components.py "$RUNNER_TEMP/payload.json"

      # The app's own signer: it checks the envelope with the app's verifier before writing it.
      # The seed reaches it only through the environment.
      - name: Sign the manifest
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          cargo run --locked --release --quiet --manifest-path manifest/Cargo.toml --bin sign-manifest -- \
            "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/signed.json"

      # Two copies of the manifest, components.json and components-b.json: the app reads both and
      # takes the newest that verifies. Each run replaces only the older copy, so the newest stays
      # online untouched however this step fails (blocking line U5).
      - name: Publish the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases"
          asset() { gh api "$api/tags/components" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          # The copy to replace: a missing one, else the one uploaded earlier.
          target=$(gh api "$api/tags/components" --jq '[.assets[] | {name, created_at}] as $have
            | ["components.json", "components-b.json"]
            | map(. as $copy | {name: $copy, at: ([$have[] | select(.name == $copy) | .created_at] | first // "")})
            | min_by(.at) | .name')
          test -n "$target"
          # A run that stopped before its rename leaves a .next nobody reads.
          for name in components.json.next components-b.json.next; do
            stale=$(asset "$name")
            if [ -n "$stale" ]; then gh api -X DELETE "$api/assets/$stale"; fi
          done
          mkdir -p "$RUNNER_TEMP/upload"
          cp "$RUNNER_TEMP/signed.json" "$RUNNER_TEMP/upload/$target.next"
          gh release upload components "$RUNNER_TEMP/upload/$target.next" --repo "$GITHUB_REPOSITORY"
          next=$(asset "$target.next")
          test -n "$next"
          old=$(asset "$target")
          if [ -n "$old" ]; then gh api -X DELETE "$api/assets/$old"; fi
          gh api -X PATCH "$api/assets/$next" -f name="$target" --jq .name
